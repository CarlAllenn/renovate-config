---
name: validate

"on":
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

# Superseded runs on the same ref are wasted work; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          # Universal cold-cache set (templates/ci/prologue.yml).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Validator pinned via mise (npm:renovate in mise.toml) — previously an
      # unpinned `npx --yes renovate` on every run, the one ad-hoc tool left.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      - name: Validate presets against Renovate's own validator
        run: |
          for f in *.json; do
            RENOVATE_CONFIG_FILE="$f" renovate-config-validator --strict
          done
      # A broken universal.yml reaches every dev machine within 24h (live
      # remote consumption) — gate it like the presets.
      - name: Validate lefthook configs
        run: |
          LEFTHOOK_CONFIG=lefthook/universal.yml lefthook validate
          lefthook validate

  secrets:
    name: gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in this repo).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # gitleaks itself makes no network calls; minimal cold-cache
          # set for the gitleaks-only install (see install_args below).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the scan re-applies the pinned ruleset to every
          # commit, not just the tip (templates/gitleaks/README.md).
          fetch-depth: 0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          # Scanner jobs install only their own tools — the history scan
          # must not pay (or egress for) the whole toolchain.
          install_args: gitleaks
      # No Taskfile in this repo — invoked directly, same flags as the
      # scan:secrets task the consuming repos wire.
      - run: gitleaks git --no-banner --redact --verbose .
