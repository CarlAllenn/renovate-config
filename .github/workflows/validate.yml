---
name: validate

"on":
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

# Superseded runs on the same ref are wasted work; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # derives the allowlist, then flips to block mode (issue #6 canon,
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Validator pinned via mise (npm:renovate in mise.toml) — previously an
      # unpinned `npx --yes renovate` on every run, the one ad-hoc tool left.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      - name: Validate presets against Renovate's own validator
        run: |
          for f in *.json; do
            RENOVATE_CONFIG_FILE="$f" renovate-config-validator --strict
          done
      # A broken universal.yml reaches every dev machine within 24h (live
      # remote consumption) — gate it like the presets.
      - name: Validate lefthook configs
        run: |
          LEFTHOOK_CONFIG=lefthook/universal.yml lefthook validate
          lefthook validate
