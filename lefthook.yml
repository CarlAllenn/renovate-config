---
# Git hooks for this repo (dogfood). The universal lint layer is consumed
# LIVE from lefthook/universal.yml via remotes: — the same mechanism every
# active repo uses, pointed at this repo's own GitHub copy so the consumed
# file is the reviewed, pushed one, not the working tree. Repo-specific jobs
# below are the gates that protect consumers: preset validation and
# universal-config validation.

remotes:
  - git_url: https://github.com/CarlAllenn/renovate-config
    refetch_frequency: 24h
    configs:
      - lefthook/universal.yml

min_version: 2.1.7
assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: renovate-config-validator
      glob: "*.json"
      # Dot-named JSON files are tool configs, not Renovate presets.
      exclude:
        - .editorconfig-checker.json
        - "**/.editorconfig-checker.json"
      run: |
        for f in {staged_files}; do
          RENOVATE_CONFIG_FILE="$f" renovate-config-validator --strict
        done
      fail_text: a broken preset breaks Renovate in every consuming repo at once

    - name: lefthook-validate
      glob: lefthook/*.{yml,yaml}
      run: LEFTHOOK_CONFIG=lefthook/universal.yml lefthook validate
      fail_text: a broken universal.yml reaches every dev machine within 24h
