# Canonical mise settings baseline — copy-template class.
#
# Repos copy this block verbatim into the top of mise.toml; propagation is a
# deliberate drift-audit, never automatic (see README.md in this directory).
# Established in issue #1 (mise baseline session, 2026-07-26).

min_version = "2026.7.12"

[settings]
lockfile = true                 # mise.lock records resolved versions + checksums
locked = true                   # strict mode: install only from pre-resolved lockfile URLs — no
                                # registry/API resolution, and ad-hoc `mise x tool@ver` installs
                                # of unpinned tools fail (mechanical no-ad-hoc enforcement)
pin = true                      # `mise use` writes exact versions, never ranges
activate_aggressive = true      # tool bin-paths go to FRONT of PATH (system tools can never shadow pins)
locked_verify_provenance = true # re-verify provenance on install even when the lockfile has entries
minimum_release_age = "72h"     # never install a release younger than 3 days (supply-chain
                                # cooldown; matches the Renovate preset's minimumReleaseAge).
                                # pipx:/npm: forward this into transitive dependency resolution.
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"] # dev Mac + CI runners; the
                                # default would also lock musl/windows we never target
disable_backends = ["asdf", "ubi"] # asdf plugins are legacy (single-maintainer bash, no
                                # checksums); ubi is deprecated upstream in favor of github:
